name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm comes from the packageManager field in package.json.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:eve
      - run: pnpm typecheck
      - run: pnpm test
      # The example agent compiles with the extension mounted.
      - run: pnpm --filter thai-ocr-agent build
      # The web app's `next build` is left out for now: Next.js 16.4.3 has a published
      # advisory, and its build stops on the first run to say so. Add
      # `pnpm --filter web build` here after upgrading Next.js.
